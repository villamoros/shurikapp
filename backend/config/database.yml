# PostgreSQL configuration.
#
# - development / test: a local PostgreSQL configured with DB_HOST, DB_PORT,
#   DB_USERNAME and DB_PASSWORD (docker-compose sets DB_HOST=db).
# - production: Supabase through DATABASE_URL.
#
# Avoid setting DATABASE_URL locally: Rails would apply it to whichever
# environment is running, including the test suite.
#
# Never commit real credentials: put them in backend/.env (git-ignored) or in
# the environment of the deploy target.
default: &default
  adapter: postgresql
  encoding: unicode
  # Keep this >= Puma threads (RAILS_MAX_THREADS).
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

local: &local
  <<: *default
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *local
  database: shurikapp_development

# Warning: the "test" database is erased and re-generated when the suite runs.
# Do not point it at the development or production database.
test:
  <<: *local
  database: shurikapp_test

# Production uses a single database (Supabase PostgreSQL) through DATABASE_URL.
# Supabase requires SSL; add `?sslmode=require` to the URL if it is not present.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
